services:
  postgres:
    image: postgres:17.5
    container_name: postgres_container_gq
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "54321:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data/pgdata
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      postgres -c max_connections=1000
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.7
               -c wal_buffers=16MB
               -c default_statistics_target=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true

  api:
    build: .
    env_file:
      - .env
    environment:
      # Переопределяем DB_HOST — внутри Docker сеть, имя сервиса "postgres"
      - DB_HOST=postgres
      - INTERNAL_API_URL=http://api:8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped
    tty: true
    stdin_open: true

  # Обратный прокси с автоматическим TLS (Let's Encrypt) — нужен для WhatsApp-вебхука
  # (Gupshup обязан достучаться по HTTPS) и веб-консоли. api сам слушает только
  # 127.0.0.1:8000, т.е. без caddy порт снаружи вообще не виден — так и было
  # задумано, пока приложение работало только как Telegram-бот через polling.
  # См. DEPLOY.md. Требует DOMAIN и ACME_EMAIL в .env.
  #
  # profiles: ["prod"] — НЕ поднимается обычным `docker compose up -d` (в dev
  # DOMAIN/ACME_EMAIL не заданы, локальный домен всё равно не резолвится на эту
  # машину). На сервере запускать явно: `docker compose --profile prod up -d`.
  caddy:
    image: caddy:2-alpine
    container_name: caddy_gq
    profiles: ["prod"]
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
