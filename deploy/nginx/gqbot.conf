## nginx-конфиг для bot.gqe-online.kz
## Установка на сервере:
##   sudo cp deploy/nginx/gqbot.conf /etc/nginx/sites-available/gqbot
##   sudo ln -sf /etc/nginx/sites-available/gqbot /etc/nginx/sites-enabled/gqbot
##   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name bot.gqe-online.kz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name bot.gqe-online.kz;

    ssl_certificate     /etc/letsencrypt/live/bot.gqe-online.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.gqe-online.kz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── Защита от сканеров учётных данных ────────────────────────
    # 444 = разрыв соединения без ответа, до проксирования в приложение.

    # Скрытые файлы и каталоги: .env, .git, .aws, .claude, .cursor и т.п.
    location ~ /\. {
        access_log off;
        return 444;
    }

    # Скрипты чужих стеков — у нас их нет
    location ~* \.(php|asp|aspx|jsp|cgi|pl|sh|bak|sql|old)$ {
        access_log off;
        return 444;
    }

    # Типовые имена конфигов с ключами — в любом каталоге,
    # включая /api/aws.json и /config/openai.json
    location ~* /(tokens|mcp|mcp_config|llm|llm_config|ai|ai_config|aws|openai|anthropic|claude|credentials|secrets|app-config|env-config|push_config|configuration|settings|manifest)\.(json|js|ya?ml|toml|txt)$ {
        access_log off;
        return 444;
    }

    # Каталоги сборки и отладочные эндпоинты чужих стеков
    # (/api/ НЕ блокируем — там наш webhook)
    location ~* ^/(dist|_profiler|__debug__|vendor|storage|wp-admin|wp-content|wp-includes)/ {
        access_log off;
        return 444;
    }

    location = /Dockerfile { access_log off; return 444; }
    location = /login      { access_log off; return 444; }

    # ── Приложение ────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
